name: newsletter
# Poniedziałek po odświeżeniu danych: szkic kampanii w Brevo z wydaniem tygodnia. Wysyłka zawsze ręcznie w Brevo.
# Ręczne uruchomienie z trybem "setup" zakłada listę i szablon potwierdzenia zapisu i zapisuje ich numery w data/newsletter.json.
on:
  schedule:
    - cron: "30 5 * * 1"   # poniedziałek 07:30 czasu PL zimą (05:30 UTC), ponad godzinę po refresh-races
  workflow_dispatch:
    inputs:
      tryb:
        description: "szkic = szkic kampanii z bieżącego tygodnia, setup = lista i szablon potwierdzenia"
        type: choice
        options: [szkic, setup]
        default: szkic
permissions:
  contents: write
jobs:
  newsletter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: szkic kampanii
        if: github.event_name == 'schedule' || inputs.tryb == 'szkic'
        env: { BREVO_API_KEY: "${{ secrets.BREVO_API_KEY }}" }
        run: npx tsx scripts/newsletter.ts
      - name: setup (lista i szablon potwierdzenia)
        if: github.event_name == 'workflow_dispatch' && inputs.tryb == 'setup'
        env: { BREVO_API_KEY: "${{ secrets.BREVO_API_KEY }}" }
        run: |
          npx tsx scripts/newsletter.ts setup
          git config user.name "plaskie-bot"
          git config user.email "bot@plaskiejestnudne.pl"
          git add data/newsletter.json
          git diff --cached --quiet || git commit -m "data: numery listy i szablonu newslettera (setup)"
          git push
